[project]
name = "nonebot-plugin-botui"
version = "0.1.0"
description = "一个 QQ 风格的 WebUI 控制台：查看机器人收发的全部消息，并以机器人的身份发消息。"
readme = "README.md"
requires-python = ">= 3.10, < 4.0"
authors = [{ name = "Lonely-Sails" }]
dependencies = [
  "aiosqlite >= 0.20.0,<1.0.0",               # 消息存储
  "fastapi >= 0.100.0",                       # WebUI 路由（nonebot2[fastapi] 已包含）
  "httpx >= 0.27.0,<1.0.0",                   # 图片代理
  "nonebot-plugin-alconna >= 0.60.0,<1.0.0",  # 跨平台命令解析与消息发送
  "nonebot-plugin-apscheduler >= 0.5.0,<1.0.0", # 定时清理
  "nonebot-plugin-localstore >= 0.7.0,<1.0.0",  # 存储文件
  "nonebot-plugin-uninfo >= 0.10.0,<1.0.0",   # 跨平台用户/场景信息
  "nonebot2 >= 2.3.0,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/Lonely-Sails/nonebot-plugin-botui"
Issues = "https://github.com/Lonely-Sails/nonebot-plugin-botui/issues"
Repository = "https://github.com/Lonely-Sails/nonebot-plugin-botui.git"

[dependency-groups]
dev = [
  "bump-my-version >= 1.2.7",
  "nonebot2[fastapi] >= 2.3.0,<3.0.0",
  "poethepoet >= 0.42.1",
  "ruff >= 0.15.2,<1.0.0",
  { include-group = "test" },
]
test = [
  "nonebot-adapter-onebot >= 2.4.6,<3.0.0",
  "nonebot2[fastapi] >= 2.3.0,<3.0.0",
  "nonebug >= 0.4.4,<1.0.0",
  "pytest >= 8.0.0",
  "poethepoet >= 0.42.1",
  "pytest-asyncio >= 1.0.0",
  "pytest-cov >= 6.0.0",
  "pytest-xdist >= 3.8.0,<4.0.0",
]

[build-system]
requires = ["uv_build >= 0.9.0,<0.11.0"]
build-backend = "uv_build"

[tool.bumpversion]
current_version = "0.1.0"
commit = true
message = "release: bump version from {current_version} to {new_version}"
tag = true

# 版本号在几处出现，必须一起改，否则 /api/meta 报的版本会长期停在旧值
[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/nonebot_plugin_botui/api.py"
search = "VERSION = '{current_version}'"
replace = "VERSION = '{new_version}'"

[[tool.bumpversion.files]]
filename = "uv.lock"
search = """name = "nonebot-plugin-botui"
version = "{current_version}""""
replace = """name = "nonebot-plugin-botui"
version = "{new_version}""""

[tool.coverage.report]
exclude_lines = [
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@overload",
  "except ImportError:",
  "pragma: no cover",
]

# CI 直接 `uvx basedpyright`（无参数），配置只能从这里读。
# 没有这段时 basedpyright 会用最严格的默认值，CI 的 BasedPyright job 必挂。
[tool.pyright]
pythonVersion = "3.10"
pythonPlatform = "All"
defineConstant = { PYDANTIC_V2 = true }
executionEnvironments = [
  # 测试里按 `src.nonebot_plugin_botui.*` 导入（插件由 plugin_dirs=["src/"]
  # 加载，模块名就带 src 前缀），所以 "." 也必须在 extraPaths 里
  { root = "./tests", extraPaths = [
    ".",
    "./src",
  ] },
  { root = "./src" },
]
typeCheckingMode = "standard"
disableBytesTypePromotions = true

[tool.nonebot]
plugin_dirs = ["src/"]
builtin_plugins = []

[tool.nonebot.adapters]
nonebot-adapter-onebot = [{name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11"}]

[tool.poe.tasks]
test = "pytest --cov=src --cov-report xml --junitxml=./junit.xml -n auto"
bump = "bump-my-version bump"
show-bump = "bump-my-version show-bump"

[tool.pytest.ini_options]
addopts = [
  "--import-mode=prepend",
  "--strict-markers",
  "--tb=short",
  "-ra",
  "-v",
]
# 必须包含 "."：插件通过 plugin_dirs = ["src/"] 加载，模块名是 src.nonebot_plugin_botui，
# 需要项目根目录在 sys.path 上。`python -m pytest` 会把 cwd 放进去，
# 但 `pytest` 命令（poe / CI 用的就是这个）不会，只写 src 和 tests 会报
# ModuleNotFoundError: No module named 'src'。
pythonpath = [".", "src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.format]
line-ending = "lf"
quote-style = "single"

[tool.ruff.lint]
select = [
  "F",     # Pyflakes
  "W",     # pycodestyle warnings
  "E",     # pycodestyle errors
  "I",     # isort
  "UP",    # pyupgrade
  "ASYNC", # flake8-async
  "C4",    # flake8-comprehensions
  "T10",   # flake8-debugger
  "T20",   # flake8-print
  "PYI",   # flake8-pyi
  "PT",    # flake8-pytest-style
  "Q",     # flake8-quotes
  "TID",   # flake8-tidy-imports
  "RUF",   # Ruff-specific rules
]
ignore = [
  "E402",   # module-import-not-at-top-of-file
  "UP037",  # quoted-annotation
  "RUF001", # ambiguous-unicode-character-string
  "RUF002", # ambiguous-unicode-character-docstring
  "RUF003", # ambiguous-unicode-character-comment
  "W191",   # indentation contains tabs
  "TID252", # relative-import
]

[tool.ruff.lint.isort]
length-sort = true
known-first-party = ["tests/*"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true
